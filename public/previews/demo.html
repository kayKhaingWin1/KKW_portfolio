<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Demo Preview</title>
  <link rel="stylesheet" href="theme.css" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var isDark = stored ? stored === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    })();
  </script>
  <style>
    .cards {
      display: grid;
      gap: 28px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }
  </style>
</head>

<body>

  <div class="section">
    <span class="eyebrow">Project Preview</span>
    <h2 class="demo-title">Loading…</h2>
    <p class="note"></p>
    <div class="cards"></div>
    <div class="visit-container">
      <a href="#" target="_blank" class="glass-pill">Visit Live Website ↗</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const project = params.get("project");

    const data = {
      food: {
        title: "Food Order — Project Demo",
        link: "https://foodorder-2ly0.onrender.com",
        note: "A full PHP + MySQL web app for browsing restaurants, building an order, and checking out — deployed via Render.",
        cards: [
          { img: "../images/home.png", caption: "Home — welcome to Food Order" },
          { img: "../images/login.png", caption: "Login — user credentials entry" },
          { img: "../images/menu.png", caption: "Restaurants — browse the restaurant list" },
          { img: "../images/restaurant.png", caption: "Menu — browse a restaurant's menu" },
          { img: "../images/checkout.png", caption: "Checkout — proceed to checkout" }
        ]
      },
      buy: {
        title: "Buy Now — Project Demo",
        link: "https://buy-now-alpha.vercel.app/",
        note: "A React + Tailwind e-commerce demo backed by a REST API.",
        cards: [
          { img: "../images/buy_home.png", caption: "Home — explore trending products" },
          { img: "../images/buy_login.png", caption: "Login — user credentials entry" },
          { img: "../images/buy_product.png", caption: "Product — colour, size, price and favourites" },
          { img: "../images/buy_product_details.png", caption: "Product details — add to cart" },
          { img: "../images/buy_cart.png", caption: "Cart — view cart items" },
          { img: "../images/buy_order_history.png", caption: "Order history — past orders" }
        ]
      },
      fashion: {
        title: "TaoTao — Fashion Ecommerce Demo",
        link: "https://taotao.onrender.com/",
        note: "A fashion-focused e-commerce demo with clothing categories, cart, and a full checkout flow.",
        cards: [
          { img: "../images/fashion_login.png", caption: "Login — user credentials entry" },
          { img: "../images/fashion_register.png", caption: "Register — registration form" },
          { img: "../images/fashion_home.png", caption: "Home — fashion homepage" },
          { img: "../images/fashion_category.png", caption: "Category — browse clothing categories" },
          { img: "../images/fashion_product.png", caption: "Product — view products with details" },
          { img: "../images/fashion_product_details.png", caption: "Product details — size, colour, add to cart" },
          { img: "../images/fashion_cart.png", caption: "Cart — review selected items" },
          { img: "../images/fashion_checkout.png", caption: "Checkout — enter details and place order" },
          { img: "../images/fashion_success.png", caption: "Success — order placed" }
        ]
      }
    };

    const content = data[project] || {
      title: "Unknown Project",
      link: "#",
      note: "Sorry, no preview is available for this project.",
      cards: []
    };

    document.querySelector("h2").textContent = content.title;
    document.querySelector(".note").textContent = content.note;
    document.querySelector(".glass-pill").href = content.link;

    const cardContainer = document.querySelector(".cards");
    content.cards.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "glass-card reveal";
      div.style.animationDelay = `${i * 0.08}s`;
      div.innerHTML = `
        <img src="${item.img}" alt="" loading="lazy" />
        <div class="caption">${item.caption}</div>
      `;
      cardContainer.appendChild(div);
    });
  </script>
</body>

</html>
